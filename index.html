<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project 05</title>
        <!-- CSS style -->
        <link rel="stylesheet" href="./assets/reset.css" />
        <link rel="stylesheet" href="./assets/styles.css" />
        <!-- GG font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- ===========
            Header
        ================
        -->
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <!-- Logo -->
                    <div class="logo">
                        <a href="#!">
                            <img
                                src="./icons/logo.svg"
                                alt="CeloBank"
                                class="logo__icon"
                            />
                        </a>
                    </div>
                    <!-- Navication -->
                    <nav class="header__nav">
                        <ul class="header__list">
                            <li>
                                <a
                                    id=""
                                    href="#!"
                                    class="header__item header__item--active"
                                    data-text="Home"
                                >
                                    Home
                                </a>
                            </li>
                            <li>
                                <a
                                    href="#!"
                                    class="header__item"
                                    data-text="Products"
                                    >Products</a
                                >
                            </li>
                            <li>
                                <a
                                    href="#!"
                                    class="header__item"
                                    data-text="Features"
                                    >Features</a
                                >
                            </li>
                            <li>
                                <a
                                    href="#!"
                                    class="header__item"
                                    data-text="Blog"
                                    >Blog</a
                                >
                            </li>
                        </ul>
                    </nav>
                    <!-- Action Btn -->
                    <div class="header__ctn">
                        <a href="#!" class="header__ctn-link">Log in</a>
                        <a href="#!" class="btn header__btn">Sign up</a>
                    </div>
                </div>
            </div>
        </header>

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
